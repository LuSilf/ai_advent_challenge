<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local LLM Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f232c;
      --fg: #e6e8eb;
      --fg-muted: #98a0ad;
      --accent: #7aa2f7;
      --accent-strong: #5d83e0;
      --user: #2a3145;
      --assistant: #1c3027;
      --error: #c45a5a;
      --border: #2c313a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 14px; font-weight: 600; margin: 0; flex: 1; color: var(--fg-muted); }
    header select, header button { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
    header button:hover { border-color: var(--accent); }
    main { flex: 1; overflow-y: auto; padding: 16px; max-width: 920px; margin: 0 auto; width: 100%; }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: var(--user); }
    .msg.assistant { background: var(--assistant); }
    .msg.error { background: var(--error); color: #fff; }
    .msg .role { font-size: 11px; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; letter-spacing: 0.5px; }
    footer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
    .composer { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; resize: none; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: inherit; min-height: 44px; max-height: 200px; }
    textarea:focus { outline: none; border-color: var(--accent); }
    button.primary { background: var(--accent); color: #0b0d12; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: var(--accent-strong); color: #fff; }
    button.primary:disabled { background: var(--border); color: var(--fg-muted); cursor: not-allowed; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 420px; width: 90%; }
    .modal h2 { margin: 0 0 8px; font-size: 16px; }
    .modal p { color: var(--fg-muted); margin: 0 0 16px; font-size: 13px; }
    .modal input { width: 100%; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font: inherit; margin-bottom: 12px; }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal button { width: 100%; }
    .hidden { display: none !important; }
    .typing { color: var(--fg-muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Local LLM Chat</h1>
    <select id="model"></select>
    <button id="clear">Clear</button>
    <button id="reset-key">Reset key</button>
  </header>
  <main id="messages"></main>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
  </footer>

  <div id="key-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>API key</h2>
      <p>Введите ваш Bearer-ключ (формат: <code>sk-…</code>). Хранится в localStorage этого браузера.</p>
      <input id="key-input" type="password" placeholder="sk-…" autocomplete="off" />
      <button id="key-save" class="primary">Save</button>
    </div>
  </div>

  <script type="module">
    const KEY_STORAGE = "llm:apiKey";
    const HISTORY_STORAGE = "llm:history";

    const els = {
      messages: document.getElementById("messages"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      clear: document.getElementById("clear"),
      resetKey: document.getElementById("reset-key"),
      model: document.getElementById("model"),
      keyModal: document.getElementById("key-modal"),
      keyInput: document.getElementById("key-input"),
      keySave: document.getElementById("key-save"),
    };

    let apiKey = localStorage.getItem(KEY_STORAGE) || "";
    let history = loadHistory();

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_STORAGE) || "[]"); }
      catch { return []; }
    }
    function saveHistory() { localStorage.setItem(HISTORY_STORAGE, JSON.stringify(history)); }

    function escapeHTML(s) { return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    function renderHistory() {
      els.messages.innerHTML = "";
      for (const m of history) appendMessage(m.role, m.content);
    }

    function appendMessage(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const r = document.createElement("div");
      r.className = "role";
      r.textContent = role;
      const c = document.createElement("div");
      c.className = "content";
      c.textContent = content;
      div.appendChild(r);
      div.appendChild(c);
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
      return c;
    }

    function showKeyModal() {
      els.keyInput.value = apiKey;
      els.keyModal.classList.remove("hidden");
      els.keyInput.focus();
    }
    function hideKeyModal() { els.keyModal.classList.add("hidden"); }

    els.keySave.addEventListener("click", () => {
      const v = els.keyInput.value.trim();
      if (!v) return;
      apiKey = v;
      localStorage.setItem(KEY_STORAGE, apiKey);
      hideKeyModal();
      loadModels();
    });
    els.keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") els.keySave.click(); });

    els.resetKey.addEventListener("click", () => {
      apiKey = "";
      localStorage.removeItem(KEY_STORAGE);
      showKeyModal();
    });

    els.clear.addEventListener("click", () => {
      history = [];
      saveHistory();
      renderHistory();
    });

    els.input.addEventListener("input", () => {
      els.input.style.height = "auto";
      els.input.style.height = Math.min(200, els.input.scrollHeight) + "px";
    });
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        els.send.click();
      }
    });

    async function loadModels() {
      els.model.innerHTML = "";
      if (!apiKey) return;
      try {
        const r = await fetch("/v1/models", { headers: { Authorization: `Bearer ${apiKey}` } });
        if (!r.ok) {
          appendErr(`Failed to load models: HTTP ${r.status}`);
          if (r.status === 401) showKeyModal();
          return;
        }
        const data = await r.json();
        for (const m of data.data || []) {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.id;
          els.model.appendChild(opt);
        }
      } catch (err) {
        appendErr(`Network error loading models: ${err.message}`);
      }
    }

    function appendErr(text) {
      const div = document.createElement("div");
      div.className = "msg error";
      div.textContent = text;
      els.messages.appendChild(div);
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    els.send.addEventListener("click", async () => {
      const text = els.input.value.trim();
      if (!text) return;
      if (!apiKey) { showKeyModal(); return; }
      const model = els.model.value;
      if (!model) { appendErr("Сначала выберите модель"); return; }

      els.input.value = "";
      els.input.style.height = "auto";
      els.send.disabled = true;

      history.push({ role: "user", content: text });
      saveHistory();
      appendMessage("user", text);

      const assistantNode = appendMessage("assistant", "");
      assistantNode.classList.add("typing");
      assistantNode.textContent = "…";

      try {
        const r = await fetch("/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({ model, messages: history, stream: true }),
        });
        if (!r.ok) {
          let detail = `HTTP ${r.status}`;
          try { const j = await r.json(); detail = j?.error?.message || detail; } catch {}
          assistantNode.classList.remove("typing");
          assistantNode.textContent = "";
          assistantNode.parentElement.classList.remove("assistant");
          assistantNode.parentElement.classList.add("error");
          assistantNode.textContent = detail;
          history.pop();
          saveHistory();
          if (r.status === 401) showKeyModal();
          return;
        }

        // SSE pass-through reader
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let assembled = "";
        assistantNode.classList.remove("typing");
        assistantNode.textContent = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let nlIdx;
          while ((nlIdx = buffer.indexOf("\n")) !== -1) {
            const line = buffer.slice(0, nlIdx).trim();
            buffer = buffer.slice(nlIdx + 1);
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const obj = JSON.parse(payload);
              const delta = obj?.choices?.[0]?.delta?.content;
              if (typeof delta === "string") {
                assembled += delta;
                assistantNode.textContent = assembled;
                els.messages.scrollTop = els.messages.scrollHeight;
              }
            } catch {}
          }
        }

        history.push({ role: "assistant", content: assembled });
        saveHistory();
      } catch (err) {
        assistantNode.classList.remove("typing");
        assistantNode.parentElement.classList.remove("assistant");
        assistantNode.parentElement.classList.add("error");
        assistantNode.textContent = `Network error: ${err.message}`;
        history.pop();
        saveHistory();
      } finally {
        els.send.disabled = false;
        els.input.focus();
      }
    });

    // bootstrap
    if (!apiKey) showKeyModal();
    renderHistory();
    loadModels();
  </script>
</body>
</html>
